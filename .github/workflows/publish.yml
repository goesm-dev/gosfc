name: Publish to npm

# Publishes @gosfc/vite and @gosfc/astro via npm Trusted Publishing (GitHub Actions OIDC).
# Each package on npmjs.com needs a Trusted Publisher: goesm-dev / gosfc / publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish @gosfc/vite
        working-directory: packages/vite
        run: npm publish --access public --tag latest
      - name: Publish @gosfc/astro
        working-directory: packages/astro
        run: |
          VITE_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('../vite/package.json','utf8')).version")
          npm pkg set "dependencies.@gosfc/vite=${VITE_VERSION}"
          npm publish --access public --tag latest
