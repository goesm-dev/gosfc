name: Publish to npm

# Publishes @gosfc/vite and @gosfc/astro via npm Trusted Publishing (GitHub Actions OIDC).
# On npmjs.com, each package needs a Trusted Publisher: goesm-dev/gosfc, workflow publish.yml.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          scope: "@gosfc"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish packages
        run: |
          pnpm --filter @gosfc/vite publish --access public --no-git-checks
          pnpm --filter @gosfc/astro publish --access public --no-git-checks
