name: Publish to npm

# Publishes @gosfc/vite and @gosfc/astro via npm Trusted Publishing (GitHub Actions OIDC).
# Each package on npmjs.com needs a Trusted Publisher: goesm-dev / gosfc / publish.yml
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Publish @gosfc/vite
        working-directory: packages/vite
        run: npm publish --access public --tag latest
      - name: Publish @gosfc/astro
        run: pnpm --filter @gosfc/astro publish --access public --no-git-checks --tag latest
