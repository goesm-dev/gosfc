name: Publish to npm

# Publishes @gosfc/vite and @gosfc/astro when a GitHub release is published
# (or when run manually). Needs the NPM_TOKEN repository secret: an npm
# automation / granular access token with publish rights to the @gosfc scope.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          scope: "@gosfc"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Verify npm authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN repository secret is missing or empty."
            exit 1
          fi
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish packages
        run: |
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          pnpm --filter @gosfc/vite --filter @gosfc/astro publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
